name: UKHO.ConfigurableStub_$(Date:yyyy)$(DayOfYear)$(Rev:.r)

resources:
- repo: self
  clean: true

trigger:
  branches:
    include:
      - refs/heads/*

queue:
  name: NautilusBuild

variables:
  buildConfiguration: 'Release'

steps:
- task: UseDotNet@2
  displayName: 'Use .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '10.x'

- task: PowerShell@2
  displayName: Apply version numbers to assemblies
  inputs:
    targetType: 'filePath'
    filePath: DeploymentScripts/Apply-AssemblyVersionAndDefaults.ps1
    arguments: -buildNumber "$(Build.BuildNumber)" -solutionDirectory "$(Build.SourcesDirectory)"

- task: DotNetCoreCLI@2
  displayName: 'Restore'
  inputs:
    command: 'restore'

- task: DotNetCoreCLI@2
  displayName: 'Build'
  inputs:
    command: 'build'
    arguments: '--no-restore --configuration $(buildConfiguration)'

- task: DotNetCoreCLI@2
  displayName: 'Pack'
  inputs:
    command: 'pack'
    arguments: '--no-build --no-restore --configuration $(buildConfiguration)'
    outputDir: '$(Build.ArtifactStagingDirectory)'

- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'Drop'